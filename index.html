<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N4 Study Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">N4 Study Hub</h1>
    <nav class="nav" aria-label="Main">
      <a href="#cards" data-nav="cards">Flashcards</a>
      <a href="#review" data-nav="review">Review / Quiz</a>
      <a href="#timetable" data-nav="timetable">Timetable</a>
      <a href="#dashboard" data-nav="dashboard">Dashboard</a>
    </nav>
  </header>

  <!-- Warnings such as "saved data was corrupted" appear here -->
  <div id="banner" class="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button type="button" id="banner-close" class="button">Dismiss</button>
  </div>

  <main>
    <section id="view-cards" data-view="cards" hidden>
      <h2>Flashcards</h2>

      <form id="card-form" class="form" novalidate>
        <h3 id="card-form-title">Add a card</h3>

        <div class="form-grid">
          <div class="field">
            <label for="card-japanese">Japanese</label>
            <input id="card-japanese" name="japanese" lang="ja" autocomplete="off"
                   placeholder="勉強" aria-describedby="card-japanese-error">
            <p id="card-japanese-error" class="error"></p>
          </div>

          <div class="field">
            <label for="card-reading">Reading (kana)</label>
            <input id="card-reading" name="reading" lang="ja" autocomplete="off"
                   placeholder="べんきょう" aria-describedby="card-reading-error">
            <p id="card-reading-error" class="error"></p>
          </div>

          <div class="field">
            <label for="card-meaning">Meaning</label>
            <input id="card-meaning" name="meaning" autocomplete="off"
                   placeholder="study" aria-describedby="card-meaning-error">
            <p id="card-meaning-error" class="error"></p>
          </div>

          <div class="field">
            <label for="card-category">Category</label>
            <input id="card-category" name="category" list="category-options" autocomplete="off"
                   placeholder="Nouns" aria-describedby="card-category-error">
            <datalist id="category-options"></datalist>
            <p id="card-category-error" class="error"></p>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="card-submit" class="button button-primary">Add card</button>
          <button type="button" id="card-cancel" class="button" hidden>Cancel</button>
          <p id="card-form-status" class="form-status" role="status"></p>
        </div>
      </form>

      <div class="toolbar">
        <div class="field">
          <label for="card-filter-category">Category</label>
          <select id="card-filter-category"></select>
        </div>
        <div class="field">
          <label for="card-search">Search</label>
          <input id="card-search" type="search" autocomplete="off" placeholder="Japanese, reading or meaning">
        </div>
        <button type="button" id="card-clear-filters" class="button">Clear</button>
      </div>
      <p id="card-count" class="count" aria-live="polite"></p>

      <ul id="card-list" class="card-list"></ul>
      <p id="card-empty" class="empty" hidden></p>

      <nav id="card-pagination" class="pagination" aria-label="Card pages" hidden>
        <button type="button" id="card-page-prev" class="button">Previous</button>
        <span id="card-page-label" class="pagination-label" aria-live="polite"></span>
        <button type="button" id="card-page-next" class="button">Next</button>
      </nav>
    </section>

    <section id="view-review" data-view="review" hidden>
      <h2>Review / Quiz</h2>

      <div class="toolbar">
        <div class="field">
          <label for="review-category">Category</label>
          <select id="review-category"></select>
        </div>
        <label class="checkbox">
          <input type="checkbox" id="review-include-known"> Include known cards
        </label>
      </div>

      <div id="review-area" class="review-area" hidden>
        <p id="review-progress" class="count"></p>

        <button type="button" id="flashcard" class="flashcard" aria-pressed="false"
                aria-describedby="flashcard-hint">
          <span class="flashcard-inner">
            <span id="flashcard-front" class="flashcard-face flashcard-front">
              <span id="flashcard-japanese" class="flashcard-japanese" lang="ja"></span>
            </span>
            <span id="flashcard-back" class="flashcard-face flashcard-back" aria-hidden="true">
              <span id="flashcard-reading" class="flashcard-reading" lang="ja"></span>
              <span id="flashcard-meaning" class="flashcard-meaning"></span>
            </span>
          </span>
        </button>
        <p id="flashcard-hint" class="hint">Click the card, or press Space or Enter, to flip it.</p>
        <p id="review-status" class="hint"></p>

        <div class="review-actions">
          <button type="button" id="review-prev" class="button">Previous</button>
          <button type="button" id="review-learning" class="button">Still learning</button>
          <button type="button" id="review-known" class="button button-primary">Known</button>
          <button type="button" id="review-next" class="button">Next</button>
        </div>
      </div>

      <p id="review-empty" class="empty" hidden></p>

      <div id="review-done" class="review-done" hidden>
        <h3>Done!</h3>
        <p id="review-summary"></p>
        <button type="button" id="review-restart" class="button button-primary">Review again</button>
      </div>
    </section>

    <section id="view-timetable" data-view="timetable" hidden>
      <h2>Timetable</h2>
      <p class="placeholder">Weekly grid coming on Day 7.</p>
    </section>

    <section id="view-dashboard" data-view="dashboard" hidden>
      <h2>Dashboard</h2>
      <p class="placeholder">Stats coming on Day 9.</p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
